<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pricing - Chatbot</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chatbot.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="chatbot-page">
    <!-- Navigation Menu Overlay -->
    <div id="menuOverlay" class="menu-overlay" onclick="closeMenu()"></div>

    <!-- Navigation Drawer -->
    <div id="menuDrawer" class="menu-drawer">
        <div class="menu-content">
            <div class="menu-header">
                <h2>Navigation</h2>
                <button onclick="closeMenu()" class="close-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <nav class="menu-nav">
                <a href="index.html" class="menu-item">
                    <i data-lucide="home"></i>
                    <span>Home</span>
                </a>
                <a href="login.html" class="menu-item">
                    <i data-lucide="log-in"></i>
                    <span>Login</span>
                </a>
                <a href="data-input.html" class="menu-item">
                    <i data-lucide="upload"></i>
                    <span>Data Input</span>
                </a>
                <a href="payment.html" class="menu-item">
                    <i data-lucide="credit-card"></i>
                    <span>Payment</span>
                </a>
                <a href="chatbot.html" class="menu-item active">
                    <i data-lucide="message-circle"></i>
                    <span>AI Assistant</span>
                </a>
            </nav>
            <div class="menu-footer">
                <p>AI Pricing Platform</p>
                <p class="copyright">© 2026 All rights reserved</p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <button onclick="openMenu()" class="hamburger-btn">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="logo">
                        <i data-lucide="trending-up"></i>
                        <div>
                            <div class="logo-title">AI Pricing Assistant</div>
                            <div class="logo-subtitle">Ask me anything</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <div class="chat-container">
        <div id="messagesContainer" class="messages-container"></div>
        
        <!-- Typing Indicator -->
        <div id="typingIndicator" class="typing-indicator" style="display: none;">
            <div class="message assistant-message">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="input-container">
        <form id="chatForm" onsubmit="sendMessage(event)">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Ask about pricing, features, or how we can help..."
                autocomplete="off"
            >
            <button type="submit">
                <i data-lucide="send"></i>
            </button>
        </form>
    </div>

    <script src="navigation.js"></script>
    <script src="chatbot.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
